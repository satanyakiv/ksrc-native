<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">How ksrc-native answers a lookup</title>
<desc id="desc">A terminal, an agent skill or an MCP client asks ksrc-native. It reads three sources on the machine: Kotlin/Native platform klibs, the native stdlib sources and Xcode SDK headers. One line comes back: file-id, line, column, text.</desc>
<defs>
<linearGradient id="kotlin" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7F52FF"/><stop offset="0.55" stop-color="#C711E1"/><stop offset="1" stop-color="#E44857"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#8c959f"/></marker>
</defs>
<text x="24" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#6e7781" text-anchor="start">WHO ASKS</text>
<text x="300" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#6e7781" text-anchor="start">KSRC-NATIVE</text>
<text x="648" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#6e7781" text-anchor="start">WHAT IT READS</text>
<rect x="300" y="68" width="288" height="292" rx="14" fill="#ffffff" stroke="url(#kotlin)" stroke-width="2"/>
<rect x="24" y="78" width="228" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Terminal</text>
<text x="40" y="134" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#59636e">search · cat · deps · where</text>
<line x1="258" y1="118.0" x2="292" y2="118.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="596" y1="118.0" x2="640" y2="118.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="318" y="90" width="206" height="28" rx="14" fill="#f3efff"/>
<text x="330" y="109" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#5a32d6">kn.platform:&lt;Framework&gt;</text>
<text x="320" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">klib dump, one .kt file per class, cached</text>
<line x1="318" y1="166" x2="570" y2="166" stroke="#d0d7de"/>
<rect x="648" y="78" width="288" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="664" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Kotlin/Native platform klibs</text>
<text x="664" y="126" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2328">~/.konan/…/klib/platform/ios_arm64</text>
<text x="664" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">platform.* signatures; binary, no sources</text>
<rect x="24" y="174" width="228" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Agent skill</text>
<text x="40" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">Claude Code and Codex plugins</text>
<line x1="258" y1="214.0" x2="292" y2="214.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="596" y1="214.0" x2="640" y2="214.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="318" y="186" width="150" height="28" rx="14" fill="#f3efff"/>
<text x="330" y="205" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#5a32d6">kn.stdlib:native</text>
<text x="320" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">unzipped once, cached</text>
<line x1="318" y1="262" x2="570" y2="262" stroke="#d0d7de"/>
<rect x="648" y="174" width="288" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="664" y="201" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Native stdlib sources</text>
<text x="664" y="222" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2328">kotlin-stdlib-native-sources.zip</text>
<text x="664" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">kotlinx.cinterop, memScoped, CPointer</text>
<rect x="24" y="270" width="228" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">MCP server</text>
<text x="40" y="326" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#59636e">ksrc-native mcp</text>
<line x1="258" y1="310.0" x2="292" y2="310.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="596" y1="310.0" x2="640" y2="310.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="318" y="282" width="190" height="28" rx="14" fill="#f3efff"/>
<text x="330" y="301" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#5a32d6">sdk.apple:&lt;Framework&gt;</text>
<text x="320" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">read in place, no copy</text>
<rect x="648" y="270" width="288" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="664" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Xcode SDK headers</text>
<text x="664" y="318" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2328">UIKit.framework/Headers/*.h</text>
<text x="664" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">Objective-C, Apple's comments, availability</text>
<text x="24" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#6e7781">WHAT COMES BACK</text>
<text x="936" y="388" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#6e7781" text-anchor="end">&lt;file-id&gt; &lt;line&gt;:&lt;col&gt;:&lt;text&gt;</text>
