name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: scripts/build.sh

      # CI=true makes a missing rg a test failure instead of a skip.
      - name: Test
        run: go test -count=1 ./...

      - name: Smoke test against the Xcode SDK
        if: runner.os == 'macOS'
        run: |
          bin/ksrc-native --version
          bin/ksrc-native doctor || true
          bin/ksrc-native search 'presentViewController' --module sdk.apple:UIKit -- --max-count 1 | tee smoke.txt
          grep -q '!/UIViewController.h ' smoke.txt
