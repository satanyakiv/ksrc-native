name: release

# Run by hand from the Actions tab. It tags the commit with the version in
# the VERSION file, builds the archives and opens a draft release. A person
# reviews the draft and publishes it.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "VERSION holds '$version', which is not a version like 1.2.3"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "the tag v$version exists already; raise VERSION first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check that the manifests name the same version
        run: go test -count=1 -run 'TestManifests' ./cmd/ksrc-native

      - name: Build the archives
        run: scripts/package.sh dist

      - name: Tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "ksrc-native $VERSION"
          git push origin "v$VERSION"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --draft \
            --verify-tag \
            --title "ksrc-native $VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
