name: release

# Run by hand from the Actions tab, on main. It runs the tests, tags the
# commit with the version in the VERSION file, builds the archives and opens
# a draft release. A person reviews the draft and publishes it.
#
# The actions are pinned to commits; the comment names the version. A tag of
# an action can be moved to other code, a commit cannot.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # A release is cut from main only. The run fails with a message; a job
      # that is skipped by an `if` would look like a release that worked.
      - name: Refuse a branch other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::the release workflow runs on main only; this run was started on $GITHUB_REF"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Read VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "VERSION holds '$version', which is not a version like 1.2.3"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "the tag v$version exists already; raise VERSION first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # The whole suite, before anything is tagged. It includes the check
      # that the manifests name the version of the VERSION file. CI=true on
      # a runner makes a missing rg a failure instead of a skip.
      - name: Test
        run: go test -count=1 ./...

      - name: Build the archives
        run: scripts/package.sh dist

      - name: Tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "ksrc-native $VERSION"
          git push origin "v$VERSION"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --draft \
            --verify-tag \
            --title "ksrc-native $VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
